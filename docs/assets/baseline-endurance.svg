<line x1="95" y1="430" x2="945" y2="430" stroke="#64748b"/>
<line x1="95" y1="430.0" x2="945" y2="430.0" stroke="#cbd5e1" stroke-dasharray="4 5"/>
<text x="83" y="435.0" text-anchor="end" font-family="system-ui,sans-serif" font-size="13" fill="#475569">0h</text>
<line x1="95" y1="356.1" x2="945" y2="356.1" stroke="#cbd5e1" stroke-dasharray="4 5"/>
<text x="83" y="361.1" text-anchor="end" font-family="system-ui,sans-serif" font-size="13" fill="#475569">5h</text>
