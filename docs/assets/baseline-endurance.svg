<text x="83" y="139.4" text-anchor="end" font-family="system-ui,sans-serif" font-size="13" fill="#475569">20h</text>
<line x1="95" y1="60.5" x2="945" y2="60.5" stroke="#cbd5e1" stroke-dasharray="4 5"/>
<text x="83" y="65.5" text-anchor="end" font-family="system-ui,sans-serif" font-size="13" fill="#475569">25h</text>
